id: collatz
version: 1
name: Collatz Simulation
description: Simulates Collatz conjecture for n=15
start_at: check_done

initial_variables:
  n: 15

steps:

  check_done:
    id: check_done
    type: if-else
    spec:
      expression:
        left: n
        operator: "=="
        right: 1
      true_next: end
      false_next: check_even

  check_even:
    id: check_even
    type: action
    spec:
      action_name: compute_even
      next: if_even

  if_even:
    id: if_even
    type: if-else
    spec:
      expression:
        left: even
        operator: "=="
        right: true
      true_next: divide
      false_next: multiply

  divide:
    id: divide
    type: action
    spec:
      action_name: divide_by_2
      next: check_done

  multiply:
    id: multiply
    type: action
    spec:
      action_name: multiply_3n_plus_1
      next: check_done

  end:
    id: end
    type: action
    spec:
      action_name: finish
